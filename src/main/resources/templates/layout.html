<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title th:text="${pageTitle} ?: 'EMS System'"></title>

  <!-- Global Styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet"/>

  <!-- Page-specific CSS -->
<!--  <th:block th:if="${pageCss != null}" th:replace="${pageCss}"></th:block>-->
</head>

<body>

<!-- Navbar -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<main class="container mt-4">
  <!-- Dynamic page content goes here -->
  <th:block th:replace="~{${content} :: content}"></th:block>
</main>

<!-- Footer -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<!-- Global Script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Optional Page Script -->
<!--<th:block th:if="${pageJs != null}" th:replace="${pageJs}"></th:block>-->

</body>
</html>
