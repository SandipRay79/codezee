<div th:fragment="content">
  <!-- Title + List button -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="page-title">Employee Directory</h2>
    <a th:href="@{/employeelist}" class="btn btn-primary px-4">+ List Employee</a>
  </div>

  <div class="container">
    <div class="card shadow-sm card-max">
      <div class="card-body">
        <h3 class="card-title mb-3">Register Employee</h3>

        <!-- Alert area -->
        <div id="alertArea"></div>
        <form id="registrationForm" method="post" th:object="${employee}" th:action="@{/register}" novalidate>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="row g-3">

            <!-- employee_id -->
            <div class="col-md-4">
              <label for="employee_id" class="form-label">Employee ID</label>
              <input type="number" class="form-control" id="employee_id" th:field="*{id}"
                     placeholder="Auto / DB generated (if blank)" min="1">
              <div class="form-text">Leave blank if ID is auto-generated.</div>
            </div>

            <!-- first_name -->
            <div class="col-md-4">
              <label class="form-label">First name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" th:field="*{firstName}" required maxlength="100" placeholder="John">
              <div class="invalid-feedback">Please provide first name.</div>
            </div>

            <!-- last_name -->
            <div class="col-md-4">
              <label class="form-label">Last name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" th:field="*{lastName}" required maxlength="100" placeholder="Doe">
              <div class="invalid-feedback">Please provide last name.</div>
            </div>

            <!-- email -->
            <div class="col-md-6">
              <label class="form-label">Email <span class="text-danger">*</span></label>
              <input type="email" class="form-control" th:field="*{email}" required maxlength="255" placeholder="name@example.com">
              <div class="invalid-feedback">Please provide a valid email address.</div>
            </div>

            <!-- Password -->
            <div class="col-md-6">
              <label class="form-label">Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" th:field="*{password}" required maxlength="255">
            </div>


            <!-- PHONE NUMBERS -->
            <div class="row g-3">

              <!-- Phone #1 -->
              <div class="col-md-6">
                <label class="form-label">Phone number 1 <span class="text-danger">*</span></label>
                <input type="tel" class="form-control"
                       th:field="*{phones[0].phoneNumber}"
                       placeholder="+91-9876543210"
                       pattern="^[+0-9()\\-.\\s]{6,25}$" maxlength="25" required>

                <div class="form-check mt-2">
                  <input class="form-check-input" type="radio" th:field="*{primaryPhoneIndex}" value="0" />
                  <label class="form-check-label">Set as Primary</label>
                </div>
              </div>

              <!-- Phone #2 -->
              <div class="col-md-6">
                <label class="form-label">Phone number 2</label>
                <input type="tel" class="form-control"
                       th:field="*{phones[1].phoneNumber}"
                       placeholder="+91-9876543211"
                       pattern="^[+0-9()\\-.\\s]{6,25}$" maxlength="25">

                <div class="form-check mt-2">
                  <input class="form-check-input" type="radio" th:field="*{primaryPhoneIndex}" value="1" />
                  <label class="form-check-label">Set as Primary</label>
                </div>
              </div>
            </div>

            <!-- hire_date -->
            <div class="col-md-4">
              <label class="form-label">Hire date <span class="text-danger">*</span></label></label>
              <input type="date" class="form-control" th:field="*{hireDate}">
            </div>

            <!-- dob -->
            <div class="col-md-4">
              <label class="form-label">Date of birth <span class="text-danger">*</span></label></label>
              <input type="date" class="form-control" th:field="*{dob}">
            </div>

            <!-- gender -->
            <div class="col-md-4">
              <label class="form-label">Gender <span class="text-danger">*</span></label></label>
              <select class="form-select" th:field="*{gender}">
                <option value="" selected>Choose...</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <!-- Address -->
            <div class="col-12">
              <label class="form-label">Address <span class="text-danger">*</span></label></label>
              <textarea class="form-control" th:field="*{address}" rows="2"></textarea>
            </div>

            <!-- department -->
            <div class="col-md-4">
              <label class="form-label">Department <span class="text-danger">*</span></label></label>
              <select class="form-select" th:field="*{departmentId}" required>
                <option value="" disabled selected>Select Department</option>
                <th:block th:each="dept : ${departments}">
                  <option th:value="${dept.id}" th:text="${dept.name}"></option>
                </th:block>
              </select>
            </div>
            <!-- role/position -->
            <div class="col-md-4">
              <label class="form-label">Position <span class="text-danger">*</span></label></label>
              <select class="form-select" th:field="*{roleId}" required>
                <option value="" disabled selected>Select Position</option>
                <th:block th:each="roleItem : ${roles}">
                  <option th:value="${roleItem.id}" th:text="${roleItem.title}"></option>
                </th:block>
              </select>
            </div>

            <!-- manager -->
            <div class="col-md-4">
              <label class="form-label">Manager <span class="text-danger">*</span></label></label>
              <select class="form-select" th:field="*{managerId}">
                <option value="">-- No Manager --</option>
                <option value="10">Asha Patel</option>
                <option value="11">Rahul Singh</option>
              </select>
            </div>

          </div>

          <!-- Buttons -->
          <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save Employee</button>
            <button type="reset" class="btn btn-outline-secondary">Reset</button>
          </div>

        </form>
      </div>
    </div>
    <p class="text-center text-muted small">Replace select options with data from your backend. Server-side validation and uniqueness checks are required.</p>
  </div>
</div>
